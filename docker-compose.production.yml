# =============================================================================
# NETWORKS - Service communication
# =============================================================================
networks:
  ragflow_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: ragflow-br
      com.docker.network.driver.mtu: 1500
